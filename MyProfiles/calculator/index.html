<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
   <h1 class="title">Simple Calculator</h1>
  <div class="calculator">
    
    <input type="text" id="result" disabled value="0">
    
    <div class="buttons">
      <button onclick="clearResult()">C</button>
      <button onclick="delChar()">DEL</button>
      <button onclick="append('%')">%</button>
      <button onclick="append('÷')">÷</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('×')">×</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('-')">-</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('+')">+</button>

      <button onclick="append('0')">0</button>
      <button onclick="append('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="script.js"></script>

  <div style="position:fixed; bottom:25px; right:25px; z-index:999;">
    <a href="../explore/explore.html" 
       style="background:#8750e6; color:white; padding:12px 24px; 
              border-radius:50px; text-decoration:none; font-weight:600; 
              box-shadow:0 4px 15px rgba(0,0,0,0.25); display:inline-block;">
       Back to Explore Page
    </a>
</body>
</html>
